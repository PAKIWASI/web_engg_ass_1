<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helpdesk Ticket Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top bar with the role switch -->
  <header class="top">
    <h1>Helpdesk</h1>

    <fieldset class="role">
      <legend>View as</legend>
      <label><input type="radio" name="role" value="Requester" checked> Requester</label>
      <label><input type="radio" name="role" value="Technician"> Technician</label>
    </fieldset>
  </header>

  <main class="layout">

    <!-- Left side: the form for a new ticket -->
    <section class="panel">
      <h2>Report an issue</h2>

      <form id="ticket-form" novalidate>
        <label for="f-name">Your name</label>
        <input id="f-name" name="name" type="text" required minlength="2" autocomplete="name">

        <label for="f-email">Email</label>
        <input id="f-email" name="email" type="email" required autocomplete="email">

        <label for="f-title">Title</label>
        <input id="f-title" name="title" type="text" required minlength="5" maxlength="80">

        <label for="f-cat">Category</label>
        <select id="f-cat" name="category" required></select>

        <label for="f-pri">Priority</label>
        <select id="f-pri" name="priority" required></select>

        <label for="f-desc">What is happening?</label>
        <textarea id="f-desc" name="description" rows="4" required minlength="15"></textarea>

        <p id="form-msg" class="msg" role="status" aria-live="polite"></p>

        <button type="submit" class="primary">Submit ticket</button>
      </form>
    </section>

    <!-- Right side: filters and the ticket list -->
    <section>
      <h2>Tickets</h2>

      <p id="summary" class="summary" aria-live="polite"></p>

      <form id="filters" class="toolbar">
        <div>
          <label for="q">Search</label>
          <input id="q" type="search" placeholder="Title, name or text">
        </div>
        <div>
          <label for="c-cat">Category</label>
          <select id="c-cat"></select>
        </div>
        <div>
          <label for="c-pri">Priority</label>
          <select id="c-pri"></select>
        </div>
        <div>
          <label for="c-st">Status</label>
          <select id="c-st"></select>
        </div>
        <button type="reset" id="clear">Clear</button>
      </form>

      <p id="count" class="count" aria-live="polite"></p>

      <div id="list" class="grid"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
